name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read # Needed to check out code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        id: configure
        with:
          persist-credentials: false
      - name: Install
        run: yarn
      - name: Check
        run: yarn ci
